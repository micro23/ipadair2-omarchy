# Wi-Fi iPad Air 2: qualified RAM boot and Wi-Fi; Orchard launcher adapter pending.
schema = 1
kind = "hardware.device"

[device]
profile = "j81"
name = "iPad Air 2 (Wi-Fi)"
apple_products = ["iPad5,3"]
dt_compatible = ["apple,j81", "apple,t7001"]

[match.dfu]
chip = 0x7001
board = 0x06

[boot]
methods = ["checkm8-pongo"]
# No Orchard launch_manifest has been built or published for this board.
# Linux USB product matching is omitted because the qualified ECM string is generic.

[firmware]
recipe = "firmware.json"

[support]
wifi = true # Qualified BCM4350 C2 / rieslinga / CIDR / u / 2.1; WPA2 Personal.
usb_serial = false # The rescue shell is Telnet over ECM, not a CDC ACM serial console.
usb_network = true
